<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="monospace" font-size="12">
  <rect x="0" y="0" width="1000" height="800" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold">Table Fan — Full Wiring Diagram</text>
  <text x="500" y="52" text-anchor="middle" font-size="11" fill="#555">RP2040-Zero + 4S 18650 pack (14.8V nominal / 16.8V max) — dial switch = hard power + speed</text>

  <!-- ============ CHARGE PATH ============ -->
  <text x="30" y="88" font-size="11" fill="#777">CHARGING (independent of dial switch)</text>
  <rect x="30" y="100" width="100" height="48" fill="#eaf2ff" stroke="#333"/>
  <text x="80" y="121" text-anchor="middle" font-size="11">USB-C</text>
  <text x="80" y="137" text-anchor="middle" font-size="11">charge in</text>
  <rect x="170" y="95" width="150" height="58" fill="#eaf2ff" stroke="#333"/>
  <text x="245" y="116" text-anchor="middle" font-size="11">4S charger</text>
  <text x="245" y="132" text-anchor="middle" font-size="11">module (16.8V)</text>
  <line x1="130" y1="124" x2="170" y2="124" stroke="#c0392b" stroke-width="2"/>
  <text x="150" y="116" text-anchor="middle" font-size="9" fill="#c0392b">5V</text>
  <line x1="245" y1="153" x2="245" y2="205" stroke="#c0392b" stroke-width="2"/>
  <line x1="290" y1="153" x2="290" y2="205" stroke="#333" stroke-width="2"/>
  <text x="252" y="185" font-size="9" fill="#c0392b">CHG+</text>
  <text x="296" y="185" font-size="9">CHG-</text>
  <text x="345" y="120" font-size="10" fill="#8e44ad">status &#8594; Zero GP13</text>
  <line x1="320" y1="116" x2="342" y2="116" stroke="#8e44ad" stroke-width="1.5"/>

  <!-- ============ BATTERY ============ -->
  <text x="30" y="200" font-size="11" fill="#777">BATTERY (4S1P, printed sled: models/battery_sled.scad)</text>
  <g font-size="11">
    <rect x="30" y="212" width="52" height="64" fill="#fff8e6" stroke="#333"/><text x="56" y="240" text-anchor="middle">cell 1</text>
    <rect x="92" y="212" width="52" height="64" fill="#fff8e6" stroke="#333"/><text x="118" y="240" text-anchor="middle">cell 2</text>
    <rect x="154" y="212" width="52" height="64" fill="#fff8e6" stroke="#333"/><text x="180" y="240" text-anchor="middle">cell 3</text>
    <rect x="216" y="212" width="52" height="64" fill="#fff8e6" stroke="#333"/><text x="242" y="240" text-anchor="middle">cell 4</text>
  </g>
  <line x1="82" y1="244" x2="92" y2="244" stroke="#c0392b" stroke-width="2"/>
  <line x1="144" y1="244" x2="154" y2="244" stroke="#c0392b" stroke-width="2"/>
  <line x1="206" y1="244" x2="216" y2="244" stroke="#c0392b" stroke-width="2"/>
  <text x="87" y="236" font-size="8" text-anchor="middle">jumper</text>
  <text x="149" y="236" font-size="8" text-anchor="middle">jumper</text>
  <text x="211" y="236" font-size="8" text-anchor="middle">jumper</text>
  <text x="30" y="292" font-size="9">cells alternate direction; series jumpers over the sled end walls</text>

  <rect x="320" y="207" width="150" height="74" fill="#e8f8e8" stroke="#333"/>
  <text x="395" y="230" text-anchor="middle" font-size="12" font-weight="bold">4S BMS</text>
  <text x="395" y="246" text-anchor="middle" font-size="9">balance + protect</text>
  <text x="395" y="260" text-anchor="middle" font-size="9">Li-ion 14.8V</text>
  <!-- balance taps B- B1 B2 B3 -->
  <line x1="56" y1="276" x2="56" y2="306" stroke="#333" stroke-width="1.5"/>
  <line x1="56" y1="306" x2="340" y2="306" stroke="#333" stroke-width="1"/>
  <line x1="340" y1="281" x2="340" y2="306" stroke="#333" stroke-width="1"/>
  <text x="60" y="302" font-size="9">B-</text>
  <line x1="118" y1="276" x2="118" y2="298" stroke="#8e44ad" stroke-width="1"/>
  <line x1="118" y1="298" x2="360" y2="298" stroke="#8e44ad" stroke-width="1"/>
  <line x1="360" y1="281" x2="360" y2="298" stroke="#8e44ad" stroke-width="1"/>
  <text x="122" y="294" font-size="9" fill="#8e44ad">B1</text>
  <line x1="180" y1="276" x2="180" y2="290" stroke="#8e44ad" stroke-width="1"/>
  <line x1="180" y1="290" x2="380" y2="290" stroke="#8e44ad" stroke-width="1"/>
  <line x1="380" y1="281" x2="380" y2="290" stroke="#8e44ad" stroke-width="1"/>
  <text x="184" y="286" font-size="9" fill="#8e44ad">B2</text>
  <line x1="242" y1="276" x2="242" y2="282" stroke="#8e44ad" stroke-width="1"/>
  <line x1="242" y1="282" x2="400" y2="282" stroke="#8e44ad" stroke-width="1"/>
  <line x1="400" y1="281" x2="400" y2="282" stroke="#8e44ad" stroke-width="1"/>
  <text x="246" y="278" font-size="9" fill="#8e44ad">B3</text>
  <!-- B+ -->
  <line x1="268" y1="244" x2="310" y2="244" stroke="#c0392b" stroke-width="2"/>
  <line x1="310" y1="244" x2="310" y2="222" stroke="#c0392b" stroke-width="2"/>
  <text x="290" y="238" font-size="9" fill="#c0392b">B+</text>
  <!-- charge in -->
  <text x="395" y="272" text-anchor="middle" font-size="8" fill="#777">CHG+/- from charger</text>

  <!-- BMS outputs -->
  <line x1="470" y1="230" x2="560" y2="230" stroke="#c0392b" stroke-width="2.5"/>
  <text x="515" y="222" font-size="9" fill="#c0392b">P+</text>
  <line x1="470" y1="258" x2="560" y2="258" stroke="#333" stroke-width="2.5"/>
  <text x="515" y="272" font-size="9">P- &#8594; GND</text>
  <line x1="560" y1="258" x2="560" y2="700" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ============ DIAL SWITCH ============ -->
  <text x="30" y="352" font-size="11" fill="#777">POWER — dial switch = hard cut of pack+</text>
  <rect x="30" y="364" width="130" height="56" fill="#ffe6e6" stroke="#333"/>
  <text x="95" y="386" text-anchor="middle" font-size="11" font-weight="bold">DIAL SWITCH</text>
  <text x="95" y="402" text-anchor="middle" font-size="9">OFF &#8592; click | &#8594; MAX</text>
  <line x1="560" y1="230" x2="560" y2="300" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="95" y1="300" x2="560" y2="300" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="95" y1="300" x2="95" y2="364" stroke="#c0392b" stroke-width="2.5"/>
  <text x="330" y="292" font-size="9" fill="#c0392b">P+ in (top of switch)</text>
  <!-- VCC bus -->
  <line x1="160" y1="392" x2="700" y2="392" stroke="#c0392b" stroke-width="2.5"/>
  <text x="430" y="384" font-size="10" fill="#c0392b">VCC bus (switched pack+)</text>

  <!-- buck 12V -->
  <rect x="200" y="414" width="120" height="60" fill="#eaf2ff" stroke="#333"/>
  <text x="260" y="436" text-anchor="middle" font-size="11">MP1584 #1</text>
  <text x="260" y="452" text-anchor="middle" font-size="11" font-weight="bold">12V &#8594; fan</text>
  <line x1="260" y1="392" x2="260" y2="414" stroke="#c0392b" stroke-width="2"/>
  <line x1="260" y1="474" x2="260" y2="700" stroke="#333" stroke-width="1"/>
  <line x1="320" y1="444" x2="384" y2="444" stroke="#e67e22" stroke-width="2.5"/>
  <polygon points="384,436 398,444 384,452" fill="#e67e22"/>
  <text x="391" y="432" font-size="9" fill="#e67e22">1N5819</text>

  <!-- buck 5V -->
  <rect x="430" y="414" width="120" height="60" fill="#eaf2ff" stroke="#333"/>
  <text x="490" y="436" text-anchor="middle" font-size="11">MP1584 #2</text>
  <text x="490" y="452" text-anchor="middle" font-size="11" font-weight="bold">5V &#8594; Zero</text>
  <line x1="490" y1="392" x2="490" y2="414" stroke="#c0392b" stroke-width="2"/>
  <line x1="490" y1="474" x2="490" y2="700" stroke="#333" stroke-width="1"/>
  <line x1="550" y1="444" x2="610" y2="444" stroke="#c0392b" stroke-width="2"/>
  <line x1="610" y1="444" x2="610" y2="534" stroke="#c0392b" stroke-width="2"/>
  <line x1="610" y1="534" x2="270" y2="534" stroke="#c0392b" stroke-width="2"/>
  <text x="440" y="528" font-size="9" fill="#c0392b">5V &#8594; Zero 5V pin</text>

  <!-- pack sense divider -->
  <text x="660" y="408" font-size="10">pack sense:</text>
  <line x1="660" y1="392" x2="660" y2="418" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="652" y="418" width="16" height="28" fill="#fff" stroke="#333"/>
  <text x="660" y="437" font-size="8" text-anchor="middle">100k</text>
  <circle cx="660" cy="454" r="3" fill="#333"/>
  <rect x="652" y="458" width="16" height="28" fill="#fff" stroke="#333"/>
  <text x="660" y="477" font-size="8" text-anchor="middle">24k</text>
  <line x1="660" y1="486" x2="660" y2="700" stroke="#333" stroke-width="1"/>
  <line x1="663" y1="454" x2="700" y2="454" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="682" y="448" font-size="9" fill="#8e44ad">&#8594;GP26</text>
  <text x="700" y="500" font-size="8" fill="#777">16.8V &#8594; 3.25V</text>

  <!-- MT3608 bench -->
  <rect x="740" y="414" width="140" height="60" fill="#f5f5f5" stroke="#999" stroke-dasharray="6,4"/>
  <text x="810" y="434" text-anchor="middle" font-size="11">MT3608 12V</text>
  <text x="810" y="449" text-anchor="middle" font-size="9" fill="#777">bench only</text>
  <text x="810" y="463" text-anchor="middle" font-size="9" fill="#777">USB 5V in</text>
  <line x1="740" y1="444" x2="700" y2="444" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="714,436 700,444 714,452" fill="#e67e22"/>
  <text x="716" y="432" font-size="9" fill="#e67e22">1N5819</text>

  <!-- 12V rail to fan -->
  <line x1="398" y1="444" x2="700" y2="444" stroke="#e67e22" stroke-width="2.5"/>
  <text x="549" y="436" font-size="9" fill="#e67e22">12V rail (diode-ORed)</text>

  <!-- ============ FAN ============ -->
  <text x="700" y="512" font-size="11" fill="#777">FAN</text>
  <rect x="700" y="524" width="150" height="116" fill="#eaf6ff" stroke="#333"/>
  <text x="775" y="544" text-anchor="middle" font-size="11" font-weight="bold">4-pin fan header</text>
  <text x="710" y="566" font-size="10">1 blk &#8212; GND</text>
  <text x="710" y="584" font-size="10" fill="#e67e22">2 yel &#8212; +12V</text>
  <text x="710" y="602" font-size="10" fill="#27ae60">3 grn &#8212; tach</text>
  <text x="710" y="620" font-size="10" fill="#2980b9">4 blu &#8212; PWM</text>
  <line x1="700" y1="444" x2="850" y2="444" stroke="#e67e22" stroke-width="2.5"/>
  <line x1="850" y1="444" x2="850" y2="584" stroke="#e67e22" stroke-width="2.5"/>
  <line x1="850" y1="584" x2="890" y2="584" stroke="#e67e22" stroke-width="2.5"/>
  <rect x="890" y="534" width="90" height="86" fill="#fff" stroke="#333"/>
  <text x="935" y="570" text-anchor="middle" font-size="10">Noctua</text>
  <text x="935" y="586" text-anchor="middle" font-size="10">NF-F12</text>
  <text x="935" y="602" text-anchor="middle" font-size="9" fill="#777">iPPC-3000</text>

  <!-- ============ ZERO ============ -->
  <text x="30" y="512" font-size="11" fill="#777">CONTROL (carrier board on mezzanine, USB-C to rear cutout)</text>
  <rect x="30" y="524" width="240" height="126" fill="#f0eaff" stroke="#333"/>
  <text x="150" y="544" text-anchor="middle" font-size="12" font-weight="bold">RP2040-Zero carrier</text>
  <text x="40" y="564" font-size="10" fill="#c0392b">5V pin &#8592; MP1584 #2</text>
  <line x1="270" y1="534" x2="270" y2="560" stroke="#c0392b" stroke-width="2"/>
  <text x="40" y="582" font-size="10">GND &#8592; rail</text>
  <line x1="150" y1="578" x2="150" y2="700" stroke="#333" stroke-width="1"/>
  <text x="40" y="600" font-size="10" fill="#2980b9">GP15 &#8594; fan PWM (25kHz)</text>
  <line x1="270" y1="596" x2="700" y2="596" stroke="#2980b9" stroke-width="2"/>
  <line x1="700" y1="596" x2="700" y2="614" stroke="#2980b9" stroke-width="2"/>
  <text x="40" y="618" font-size="10" fill="#27ae60">GP14 &#8592; tach (+10k&#8593;3V3)</text>
  <line x1="270" y1="614" x2="700" y2="614" stroke="#27ae60" stroke-width="2"/>
  <line x1="700" y1="614" x2="700" y2="602" stroke="#27ae60" stroke-width="2"/>
  <text x="40" y="636" font-size="10" fill="#8e44ad">GP12 &#8592; dial / GP13 &#8592; chg / GP26 &#8592; sense</text>

  <!-- dial pot -->
  <rect x="310" y="544" width="130" height="80" fill="#fff" stroke="#333"/>
  <text x="375" y="564" text-anchor="middle" font-size="11" font-weight="bold">10k dial</text>
  <text x="375" y="580" text-anchor="middle" font-size="9">w/ on-off switch</text>
  <text x="320" y="598" font-size="9" fill="#c0392b">top &#8592; 3V3</text>
  <text x="320" y="612" font-size="9" fill="#8e44ad">wiper &#8594; GP12</text>
  <line x1="375" y1="612" x2="270" y2="632" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="320" y="622" font-size="9">bot &#8592; GND</text>
  <line x1="270" y1="578" x2="310" y2="594" stroke="#c0392b" stroke-width="1"/>
  <text x="282" y="590" font-size="8" fill="#c0392b">3V3</text>
  <line x1="270" y1="622" x2="310" y2="620" stroke="#333" stroke-width="1"/>
  <line x1="290" y1="621" x2="290" y2="700" stroke="#333" stroke-width="1"/>
  <text x="470" y="600" font-size="9" fill="#777">tach: 10k pull-up</text>
  <text x="470" y="612" font-size="9" fill="#777">to 3V3 on carrier</text>
  <text x="470" y="630" font-size="9" fill="#777">divider + pull-up</text>
  <text x="470" y="642" font-size="9" fill="#777">live on carrier</text>

  <!-- ============ DISPLAY (0.96" OLED, rear pod) ============ -->
  <text x="300" y="640" font-size="11" fill="#777">DISPLAY (rear pod)</text>
  <rect x="300" y="648" width="180" height="44" fill="#fff4e6" stroke="#333"/>
  <text x="390" y="666" text-anchor="middle" font-size="10" font-weight="bold">0.96" OLED (I2C)</text>
  <text x="390" y="680" text-anchor="middle" font-size="9">SSD1306 128x64, rear pod, 3V3</text>
  <!-- I2C + power from Zero bottom edge, direct (3.3V logic, no shifter) -->
  <line x1="100" y1="650" x2="100" y2="662" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="100" y1="662" x2="300" y2="662" stroke="#c0392b" stroke-width="1.5"/>
  <text x="200" y="656" font-size="9" fill="#c0392b">3V3 &#8594; VCC</text>
  <line x1="170" y1="650" x2="170" y2="674" stroke="#8e44ad" stroke-width="1.5"/>
  <line x1="170" y1="674" x2="300" y2="674" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="235" y="668" font-size="9" fill="#8e44ad">GP0/SDA</text>
  <line x1="210" y1="650" x2="210" y2="686" stroke="#8e44ad" stroke-width="1.5"/>
  <line x1="210" y1="686" x2="300" y2="686" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="255" y="680" font-size="9" fill="#8e44ad">GP1/SCL</text>
  <!-- GND drop -->
  <line x1="390" y1="692" x2="390" y2="700" stroke="#333" stroke-width="1"/>
  <text x="300" y="712" font-size="8" fill="#777">3.3V logic native &#8212; no level shifter. Check GND/VCC pin order on the silkscreen!</text>

  <!-- GND rail -->
  <line x1="30" y1="700" x2="970" y2="700" stroke="#333" stroke-width="2.5"/>
  <text x="976" y="704" font-size="10">GND</text>
  <text x="30" y="728" font-size="10" fill="#777">Notes:</text>
  <text x="30" y="744" font-size="10" fill="#777">- Dial switch breaks pack+ (hard off). Charging works with dial OFF (charger &#8594; BMS directly).</text>
  <text x="30" y="760" font-size="10" fill="#777">- 12V sources diode-ORed (1N5819 Schottky): pack buck normally, MT3608 for USB bench power. Fan sees ~11.7V.</text>
  <text x="30" y="776" font-size="10" fill="#777">- Divider 100k/24k on P+ (unswitched): 16.8V &#8594; 3.25V at GP26. Star-ground high-current paths at BMS P-.</text>
  <text x="30" y="792" font-size="10" fill="#777">- Display: 0.96" SSD1306 OLED (128x64, I2C) in the rear pod, direct to Zero 3V3/GP0/GP1. No level shifter. Verify GND/VCC pin order on the module's silkscreen before wiring.</text>
</svg>
