<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 944" font-family="monospace" font-size="12">
  <rect x="0" y="0" width="1000" height="944" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold">Table Fan — Full Wiring Diagram</text>
  <text x="500" y="52" text-anchor="middle" font-size="11" fill="#555">RP2040-Zero + 4S 18650 pack (14.8V nominal / 16.8V max) — dial switch = hard power + speed</text>

  <!-- ============ CHARGE PATH ============ -->
  <text x="30" y="88" font-size="11" fill="#777">CHARGING (independent of dial switch)</text>
  <rect x="30" y="100" width="100" height="48" fill="#eaf2ff" stroke="#333"/>
  <text x="80" y="121" text-anchor="middle" font-size="11">USB-C</text>
  <text x="80" y="137" text-anchor="middle" font-size="11">charge in</text>
  <rect x="170" y="95" width="150" height="58" fill="#eaf2ff" stroke="#333"/>
  <text x="245" y="116" text-anchor="middle" font-size="11">4S charger</text>
  <text x="245" y="132" text-anchor="middle" font-size="11">module (16.8V)</text>
  <line x1="130" y1="124" x2="170" y2="124" stroke="#c0392b" stroke-width="2"/>
  <text x="150" y="116" text-anchor="middle" font-size="9" fill="#c0392b">5V</text>
  <polyline points="245,153 245,176 410,176 410,207" fill="none" stroke="#c0392b" stroke-width="2"/>
  <polyline points="290,153 290,164 440,164 440,207" fill="none" stroke="#333" stroke-width="2"/>
  <text x="334" y="187" font-size="9" fill="#c0392b">CHG+</text>
  <text x="334" y="160" font-size="9">CHG-</text>
  <text x="345" y="114" font-size="10" fill="#8e44ad">status &#8594; J6 CHG (board: 10k &#8594; GP13)</text>
  <text x="345" y="128" font-size="9" fill="#c0392b">MEASURE the status pin first: GP13 tolerates only 3.3V</text>
  <line x1="320" y1="116" x2="342" y2="116" stroke="#8e44ad" stroke-width="1.5"/>

  <!-- ============ BATTERY ============ -->
  <text x="30" y="200" font-size="11" fill="#777">BATTERY (4S1P, printed sled: models/battery_sled.scad)</text>
  <g font-size="11">
    <rect x="30" y="212" width="52" height="64" fill="#fff8e6" stroke="#333"/><text x="56" y="240" text-anchor="middle">cell 1</text>
    <rect x="92" y="212" width="52" height="64" fill="#fff8e6" stroke="#333"/><text x="118" y="240" text-anchor="middle">cell 2</text>
    <rect x="154" y="212" width="52" height="64" fill="#fff8e6" stroke="#333"/><text x="180" y="240" text-anchor="middle">cell 3</text>
    <rect x="216" y="212" width="52" height="64" fill="#fff8e6" stroke="#333"/><text x="242" y="240" text-anchor="middle">cell 4</text>
  </g>
  <line x1="82" y1="244" x2="92" y2="244" stroke="#c0392b" stroke-width="2"/>
  <line x1="144" y1="244" x2="154" y2="244" stroke="#c0392b" stroke-width="2"/>
  <line x1="206" y1="244" x2="216" y2="244" stroke="#c0392b" stroke-width="2"/>

  <rect x="320" y="207" width="150" height="74" fill="#e8f8e8" stroke="#333"/>
  <text x="395" y="230" text-anchor="middle" font-size="12" font-weight="bold">4S BMS</text>
  <text x="395" y="246" text-anchor="middle" font-size="9">balance + protect</text>
  <text x="395" y="260" text-anchor="middle" font-size="9">Li-ion 14.8V</text>
  <!-- balance taps B- B1 B2 B3 -->
  <line x1="56" y1="276" x2="56" y2="306" stroke="#333" stroke-width="1.5"/>
  <line x1="56" y1="306" x2="340" y2="306" stroke="#333" stroke-width="1"/>
  <line x1="340" y1="281" x2="340" y2="306" stroke="#333" stroke-width="1"/>
  <text x="60" y="302" font-size="9">B-</text>
  <line x1="118" y1="276" x2="118" y2="298" stroke="#8e44ad" stroke-width="1"/>
  <line x1="118" y1="298" x2="360" y2="298" stroke="#8e44ad" stroke-width="1"/>
  <line x1="360" y1="281" x2="360" y2="298" stroke="#8e44ad" stroke-width="1"/>
  <text x="122" y="294" font-size="9" fill="#8e44ad">B1</text>
  <line x1="180" y1="276" x2="180" y2="290" stroke="#8e44ad" stroke-width="1"/>
  <line x1="180" y1="290" x2="380" y2="290" stroke="#8e44ad" stroke-width="1"/>
  <line x1="380" y1="281" x2="380" y2="290" stroke="#8e44ad" stroke-width="1"/>
  <text x="184" y="286" font-size="9" fill="#8e44ad">B2</text>
  <line x1="242" y1="276" x2="242" y2="282" stroke="#8e44ad" stroke-width="1"/>
  <line x1="242" y1="282" x2="400" y2="282" stroke="#8e44ad" stroke-width="1"/>
  <line x1="400" y1="281" x2="400" y2="282" stroke="#8e44ad" stroke-width="1"/>
  <text x="246" y="278" font-size="9" fill="#8e44ad">B3</text>
  <!-- B+ -->
  <line x1="268" y1="244" x2="310" y2="244" stroke="#c0392b" stroke-width="2"/>
  <polyline points="310,244 310,222 320,222" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="290" y="238" font-size="9" fill="#c0392b">B+</text>
  <!-- charge in -->
  <text x="395" y="272" text-anchor="middle" font-size="8" fill="#777">CHG+/- from charger</text>

  <!-- BMS outputs -->
  <polyline points="450,281 450,330 428,330" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="456" y="298" font-size="9" fill="#c0392b">P+</text>
  <rect x="400" y="323" width="28" height="14" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="414" y="333" text-anchor="middle" font-size="8" fill="#c0392b">2A</text>
  <text x="414" y="319" text-anchor="middle" font-size="8" fill="#c0392b">fuse</text>
  <polyline points="470,258 595,258 595,428" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="478" y="252" font-size="9">P- &#8594; J1 &#8722; (ground star)</text>

  <!-- ============ DIAL SWITCH ============ -->
  <text x="110" y="352" font-size="11" fill="#777">POWER — dial switch = hard cut of pack+</text>
  <rect x="30" y="364" width="130" height="56" fill="#ffe6e6" stroke="#333"/>
  <text x="95" y="386" text-anchor="middle" font-size="11" font-weight="bold">DIAL SWITCH</text>
  <text x="95" y="402" text-anchor="middle" font-size="9">OFF &#8592; click | &#8594; MAX</text>
  <polyline points="400,330 95,330 95,364" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="110" y="326" font-size="9" fill="#c0392b">fused P+ &#8594; top of dial switch</text>
  <polyline points="160,392 545,392 545,428" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="250" y="386" font-size="9" fill="#c0392b">switched pack+ &#8594; J1 + (18 AWG)</text>

  <!-- ============ CARRIER + PSU BOARD ============ -->
  <rect x="180" y="440" width="520" height="360" fill="#f7f4fc" stroke="#333" stroke-width="1.5"/>
  <text x="190" y="458" font-size="12" font-weight="bold">CARRIER + PSU BOARD (electronics/pcb)</text>
  <text x="190" y="472" font-size="9" fill="#777">on the bottom plate; GND = both pours</text>
  <!-- J1 -->
  <rect x="520" y="428" width="100" height="34" fill="#fff" stroke="#333"/>
  <text x="570" y="444" text-anchor="middle" font-size="9" font-weight="bold">J1 VIN</text>
  <text x="545" y="456" text-anchor="middle" font-size="9" fill="#c0392b">+</text>
  <text x="595" y="456" text-anchor="middle" font-size="9">&#8722;</text>
  <!-- VIN bus -->
  <polyline points="545,462 545,490 260,490" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="486" font-size="9" fill="#c0392b">VIN (12–16.8 V)</text>
  <line x1="545" y1="487" x2="555" y2="487" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="555" y="476" width="52" height="22" fill="#fff" stroke="#333"/>
  <text x="581" y="490" text-anchor="middle" font-size="8">47µF 35V</text>
  <!-- 5 V buck -->
  <line x1="260" y1="490" x2="260" y2="510" stroke="#c0392b" stroke-width="2"/>
  <rect x="200" y="510" width="120" height="50" fill="#eaf2ff" stroke="#333"/>
  <text x="260" y="530" text-anchor="middle" font-size="11">MP1584</text>
  <text x="260" y="546" text-anchor="middle" font-size="11" font-weight="bold">5 V (4.98)</text>
  <line x1="260" y1="560" x2="260" y2="572" stroke="#c0392b" stroke-width="2"/>
  <polygon points="253,572 267,572 260,584" fill="#c0392b"/>
  <text x="268" y="582" font-size="9" fill="#c0392b">SS14</text>
  <line x1="260" y1="584" x2="260" y2="625" stroke="#c0392b" stroke-width="2"/>
  <!-- 12 V buck -->
  <line x1="400" y1="490" x2="400" y2="510" stroke="#c0392b" stroke-width="2"/>
  <rect x="340" y="510" width="120" height="50" fill="#eaf2ff" stroke="#333"/>
  <text x="400" y="530" text-anchor="middle" font-size="11">MP1584</text>
  <text x="400" y="546" text-anchor="middle" font-size="11" font-weight="bold">12.0 V</text>
  <line x1="400" y1="560" x2="400" y2="572" stroke="#e67e22" stroke-width="2.5"/>
  <polygon points="393,572 407,572 400,584" fill="#e67e22"/>
  <text x="408" y="582" font-size="9" fill="#e67e22">SS34</text>
  <polyline points="400,584 400,605 620,605" fill="none" stroke="#e67e22" stroke-width="2.5"/>
  <text x="430" y="600" font-size="9" fill="#e67e22">12 V rail (fan)</text>
  <!-- battery divider -->
  <line x1="480" y1="490" x2="480" y2="500" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="472" y="500" width="16" height="24" fill="#fff" stroke="#333"/>
  <text x="480" y="516" font-size="7" text-anchor="middle">100k</text>
  <circle cx="480" cy="532" r="3" fill="#333"/>
  <line x1="480" y1="524" x2="480" y2="540" stroke="#333" stroke-width="1"/>
  <rect x="472" y="540" width="16" height="24" fill="#fff" stroke="#333"/>
  <text x="480" y="556" font-size="7" text-anchor="middle">22k</text>
  <text x="480" y="574" font-size="7" text-anchor="middle" fill="#777">GND</text>
  <line x1="483" y1="532" x2="496" y2="532" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="498" y="530" font-size="9" fill="#8e44ad">&#8594;GP26</text>
  <text x="498" y="542" font-size="8" fill="#8e44ad">+100nF</text>
  <!-- bench input, diode-ORed -->
  <polyline points="620,526 590,526 590,540" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="583,540 597,540 590,552" fill="#e67e22"/>
  <text x="582" y="551" text-anchor="end" font-size="9" fill="#e67e22">SS34</text>
  <line x1="590" y1="552" x2="590" y2="605" stroke="#e67e22" stroke-width="2"/>
  <circle cx="590" cy="605" r="3" fill="#e67e22"/>

  <!-- RP2040-Zero -->
  <rect x="200" y="625" width="400" height="162" fill="#f0eaff" stroke="#333"/>
  <text x="400" y="642" text-anchor="middle" font-size="11" font-weight="bold">RP2040-Zero (USB-C out the back)</text>
  <text x="210" y="660" font-size="10" fill="#c0392b">5V   &#8592; 5 V buck via SS14</text>
  <text x="210" y="674" font-size="10" fill="#8e44ad">GP26 &#8592; divider: 16.8V &#8594; 3.03V</text>
  <text x="210" y="688" font-size="10" fill="#2980b9">GP15 &#8594; J2 pin 4, fan PWM (25kHz)</text>
  <text x="210" y="702" font-size="10" fill="#27ae60">GP14 &#8592; J2 pin 3, tach (+10k&#8593;3V3, 1nF)</text>
  <text x="210" y="716" font-size="10" fill="#8e44ad">GP27 &#8592; J3 pin 2, dial wiper</text>
  <text x="210" y="730" font-size="10" fill="#8e44ad">GP0/GP1 &#8594; J4 pins 4/3, SDA/SCL</text>
  <text x="210" y="744" font-size="10" fill="#8e44ad">GP11 &#8592; J5 pin 1, button (pull-up)</text>
  <text x="210" y="758" font-size="10" fill="#8e44ad">GP13 &#8592; J6 pin 1 via 10k (+ clamp)</text>
  <text x="210" y="772" font-size="10" fill="#c0392b">3V3  &#8594; J3 pin 1, J4 pin 2</text>

  <!-- ============ CONNECTORS AND WHAT PLUGS IN ============ -->
  <rect x="620" y="508" width="120" height="30" fill="#fff" stroke="#333"/>
  <text x="680" y="520" text-anchor="middle" font-size="9" font-weight="bold">J7 BENCH</text>
  <text x="680" y="532" text-anchor="middle" font-size="8">1 +12V  2 GND</text>
  <rect x="780" y="500" width="190" height="44" fill="#f5f5f5" stroke="#999" stroke-dasharray="6,4"/>
  <text x="875" y="512" text-anchor="middle" font-size="9">MT3608 12V boost</text>
  <text x="875" y="524" text-anchor="middle" font-size="9" fill="#777">bench only, USB 5V in</text>
  <line x1="780" y1="526" x2="752" y2="526" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="752,520 740,526 752,532" fill="#e67e22"/>
  <rect x="620" y="566" width="120" height="76" fill="#eaf6ff" stroke="#333"/>
  <text x="680" y="580" text-anchor="middle" font-size="9" font-weight="bold">J2 FAN (4-pin)</text>
  <text x="630" y="594" font-size="9">1 GND</text>
  <text x="630" y="608" font-size="9" fill="#e67e22">2 +12V</text>
  <text x="630" y="622" font-size="9" fill="#27ae60">3 tach</text>
  <text x="630" y="636" font-size="9" fill="#2980b9">4 PWM</text>
  <line x1="740" y1="604" x2="780" y2="604" stroke="#e67e22" stroke-width="2.5"/>
  <rect x="780" y="572" width="190" height="60" fill="#fff" stroke="#333"/>
  <text x="875" y="584" text-anchor="middle" font-size="9">Noctua NF-F12 iPPC-3000</text>
  <text x="875" y="596" text-anchor="middle" font-size="9" fill="#777">its own plug, straight in</text>
  <rect x="620" y="650" width="120" height="30" fill="#fff" stroke="#333"/>
  <text x="680" y="662" text-anchor="middle" font-size="9" font-weight="bold">J3 DIAL</text>
  <text x="680" y="674" text-anchor="middle" font-size="8">1 3V3  2 wiper  3 GND</text>
  <line x1="740" y1="665" x2="780" y2="665" stroke="#777" stroke-width="1.5"/>
  <rect x="780" y="650" width="190" height="30" fill="#fff" stroke="#333"/>
  <text x="875" y="662" text-anchor="middle" font-size="9">10k dial pot</text>
  <text x="875" y="674" text-anchor="middle" font-size="9" fill="#777">ends 3V3/GND, wiper middle</text>
  <rect x="620" y="686" width="120" height="30" fill="#fff" stroke="#333"/>
  <text x="680" y="698" text-anchor="middle" font-size="9" font-weight="bold">J4 OLED</text>
  <text x="680" y="710" text-anchor="middle" font-size="8">1 GND 2 3V3 3 SCL 4 SDA</text>
  <line x1="740" y1="701" x2="780" y2="701" stroke="#777" stroke-width="1.5"/>
  <rect x="780" y="686" width="190" height="30" fill="#fff" stroke="#333"/>
  <text x="875" y="698" text-anchor="middle" font-size="9">0.96" OLED (I2C), rear pod</text>
  <text x="875" y="710" text-anchor="middle" font-size="9" fill="#777">SSD1306, 3V3: check pin order</text>
  <rect x="620" y="722" width="120" height="30" fill="#fff" stroke="#333"/>
  <text x="680" y="734" text-anchor="middle" font-size="9" font-weight="bold">J5 BTN</text>
  <text x="680" y="746" text-anchor="middle" font-size="8">1 GP11  2 GND</text>
  <line x1="740" y1="737" x2="780" y2="737" stroke="#777" stroke-width="1.5"/>
  <rect x="780" y="722" width="190" height="30" fill="#fff" stroke="#333"/>
  <text x="875" y="734" text-anchor="middle" font-size="9">screen button</text>
  <text x="875" y="746" text-anchor="middle" font-size="9" fill="#777">to GND</text>
  <rect x="620" y="758" width="120" height="30" fill="#fff" stroke="#333"/>
  <text x="680" y="770" text-anchor="middle" font-size="9" font-weight="bold">J6 CHG</text>
  <text x="680" y="782" text-anchor="middle" font-size="8">1 STAT  2 GND</text>
  <line x1="740" y1="773" x2="780" y2="773" stroke="#8e44ad" stroke-width="1.5"/>
  <rect x="780" y="758" width="190" height="30" fill="#fff" stroke="#333"/>
  <text x="875" y="770" text-anchor="middle" font-size="9">4S charger STAT pin</text>
  <text x="875" y="782" text-anchor="middle" font-size="9" fill="#c0392b">measure it first</text>

  <text x="30" y="824" font-size="10" fill="#777">Notes:</text>
  <text x="30" y="840" font-size="10" fill="#777">- 2A fuse (or 1.5A PTC) at BMS P+, before the dial switch; the charger lands on the pack side of it. Dial switch breaks pack+ (hard off).</text>
  <text x="30" y="856" font-size="10" fill="#777">- Charging works with the dial OFF. Common-port BMS (no CHG- pad): CHG+ &#8594; P+, CHG- &#8594; P-. The USB-C socket needs 5.1k CC pull-downs.</text>
  <text x="30" y="872" font-size="10" fill="#777">- Outputs set by resistors (12.0 V, 4.98 V): nothing to adjust. 12V diode-ORed (SS34): pack buck, or the MT3608 into J7 for bench power.</text>
  <text x="30" y="888" font-size="10" fill="#777">- Divider 100k/22k on the SWITCHED supply (+100nF at GP26), so the off Zero isn't back-powered. Star ground at J1 &#8722;. Fan sees ~11.7V.</text>
  <text x="30" y="904" font-size="10" fill="#777">- SS14 always fitted: USB can't back-feed the 5V buck. STAT: the 10k is on the board; fit the clamp diode only if STAT exceeds 3.3V.</text>
  <text x="30" y="920" font-size="10" fill="#777">- Leads plug into JST XH headers J3-J7 (pin 1 at the silkscreen triangle). Cells: tabbed or spot-welded nickel strip, never soldered.</text>
</svg>
